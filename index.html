/* ---------- タブ3：日程（プログラム） ---------- */
function officialLanePill(e){
  return META.laneConfirmed && e && e.heat != null && e.lane != null
    ? `<span class="pill" style="color:var(--gold)">第${esc(e.heat)}組 ${esc(e.lane)}レーン</span>` : "";
}
function officialLaneSort(list){
  return [...list].sort((a,b)=>{
    const ah = a.heat != null ? Number(a.heat) : 9999;
    const bh = b.heat != null ? Number(b.heat) : 9999;
    const al = a.lane != null ? Number(a.lane) : 9999;
    const bl = b.lane != null ? Number(b.lane) : 9999;
    return ah-bh || al-bl || secOf(a)-secOf(b) || a.name.localeCompare(b.name,"ja");
  });
}
function viewPg(){
  const days = [...new Set(PROGRAM.map(p=>p.day).filter(Boolean))];
  const segs = days.length>1
    ? `<div class="seg"><button data-d="all" class="${ST.day==="all"?"on":""}">${days.length>2?"全日":"両日"}</button>` +
      days.map(d=>`<button data-d="${esc(d)}" class="${ST.day===d?"on":""}">${esc((META.dayDates||{})[d] || d)}</button>`).join("") + `</div>`
    : "";
  let pg = PROGRAM;
  if(ST.day !== "all") pg = pg.filter(p => p.day === ST.day);

  if(ST.pgNo != null){
    const p = PROGRAM.find(x => x.no === ST.pgNo);
    const list0 = ENTRIES.filter(e => (e.programNos||[]).includes(ST.pgNo))
      .concat(RELAYS.filter(r => (r.programNos||[]).includes(ST.pgNo))
                    .map(r => Object.assign({}, r, {name:r.team, team:"", isRelay:true})))
      ;
    // 公式の組・レーンがある場合は、申込タイム順ではなく「第1組→第2組…／各組はレーン順」で表示する。
    const done = hasRes(list0);
    const list = done ? [...list0].sort((a,b)=> resKey(a)-resKey(b) || resSec(a)-resSec(b)) : officialLaneSort(list0);
    const unit = list.length && list.every(e => e.isRelay) ? "チーム" : "名";
    const rc = RACE_BY_NO.get(ST.pgNo);
    const together = (rc && (rc.nos.length > 1 || rc.classes.length > 1))
      ? `<div class="note">このレースは <b>${esc(rc.classes.join("・"))}</b>が<b>一緒に泳ぎます</b>${rc.nos.length>1?`（No.${rc.nos.join("・")}）`:""}。
          順位・賞状は<b>学年区分ごと</b>なので、同じ組の着順とは一致しません。</div>`
      : "";
    // 前後の種目へ一覧に戻らず移れるように（当日は次々に追いかけるので）。上下に同じボタンを置く
    const idx = PROGRAM.findIndex(x => x.no === ST.pgNo);
    const pv = PROGRAM[idx - 1], nx = PROGRAM[idx + 1];
    const short = x => `No.${x.no} ${isF(x.gender)?"女":"男"} ${esc((x.distance||"")+(x.stroke||"").replace("メドレーリレー","MR").replace("フリーリレー","FR").replace("個人メドレー","IM").replace("バタフライ","バタ").replace("平泳ぎ","平").replace("背泳ぎ","背").replace("自由形","自"))}${x.classGrade?" "+esc(x.classGrade.replace("年生",""))  :""}`;
    const nb = (x, id, dir) => x ? `<button class="tab pgnav ${gcls(x.gender)}" data-go="${id}" style="min-height:52px;flex:1;min-width:0;background:var(--card2);border-radius:11px;border:1px solid var(--border);color:var(--accent);font-size:12px;white-space:normal;line-height:1.3">${dir<0?"◀ ":""}${short(x)}${dir>0?" ▶":""}</button>`
                               : `<span style="flex:1"></span>`;
    const nav = `<div style="display:flex;gap:8px;margin:0 0 10px">${nb(pv,-1,-1)}${nb(nx,1,1)}</div>`;
    return `<button class="tab" id="back" style="min-height:48px;width:100%;background:var(--card2);border-radius:11px;border:1px solid var(--border);color:var(--accent);margin-bottom:10px">← ${PROGRAM.some(p=>p.day) ? "プログラム一覧" : "種目一覧"}へ戻る</button>
      ${nav}
      ${pgHead(p)}
      ${together}
      ${META.lanePrediction ? `<button class="tab" id="toLn" style="min-height:48px;width:100%;background:var(--card2);border-radius:11px;border:1px solid var(--border);color:var(--accent);margin-bottom:10px">🏁 この種目の組・レーンを見る</button>` : ""}
      ${p&&p.note?`<div class="note">${md(p.note)}</div>`:""}
      ${stdHead(list)}
      ${list.length?`<div class="count">${done ? "🏁 結果" : ordLabel()}・<b>${list.length}</b>${unit}</div>`:""}
      ${list.map(e=>{ const chb = chBtn(e, "pg", {evLabel: p ? `No.${p.no} ${glabel(p.gender)} ${(p.distance||"")+" "+(p.stroke||"")} ${p.round||""}`.trim() : ""});
        return `<div class="sw ${gcls(e.gender)}${isMk(e)?" hl":""}${chb?" hasch":""}"${chb?` data-chrow="${chLast()}"`:""}>${chb}
        <div class="sw-r1"><span class="sw-nm">${esc(e.name)}</span>${
          e.result ? `<span class="sw-bd" style="color:var(--gold)">${esc(e.result.time || e.result.note || "")}</span>${recMk(e)}`
                   : tmTag(e,"span","sw-bd")}</div>
        <div class="sw-r2">${e.team?`<span class="sw-tm">${esc(e.team)}</span>`:""}${officialLanePill(e)}${mkPill(e)}
          ${e.grade?`<span class="pill">${esc(shortGrade(e.grade))}</span>`:""}
          <span class="pill ${gcls(e.gender)}">${isF(e.gender)?"女子":"男子"}</span>
          ${e.result&&e.result.rank?`<span class="pill rk${e.result.rank===1&&isFinalA(e)?" m1":""}">${medalOf(e)}${e.result.rank}位</span>${ovPill(e)}${advPill(e)}`:""}
          ${e.result&&e.time?`<span class="pill ent">申込 ${esc(e.time)}</span>`:""}
          ${tags(e)}</div>${memLine(e)}</div>`; }).join("")}
      <div style="height:12px"></div>${nav}`;
  }

  const cnt = no => ENTRIES.filter(e => (e.programNos||[]).includes(no)).length
                  + RELAYS.filter(r => (r.programNos||[]).includes(no)).length;
  // 組数は申込数から数える。公式の日程表と食い違うときだけ、その旨を添える。
  const heatInfo = p => {
    const n = cnt(p.no); if(!n) return "";
    const h = Math.ceil(n / LANES.length);
    if(!p.heats) return META.lanePrediction === false ? "" : `・${h}組（予想）`;   // 組の予想を出さない大会では件数だけ
    // 公式の組数が分かっている場合は必ずそれを主表示にする。申込数からの計算値は
    // 食い違うときだけ参考値として添える（公式より予想を前面に出さない）。
    return p.heats === h ? `・${h}組` : `・${p.heats}組（申込${n}件からの参考値は${h}組）`;
  };
  return segs + pg.map(p=>`<div class="pg ${gcls(p.gender)}" data-no="${p.no}">
      <div class="pg-r">
        <span class="pg-no">No.${p.no}</span>
        <span class="pg-nm">${esc((p.distance||"")+" "+(p.stroke||""))}</span>
        <span class="pill ${gcls(p.gender)}">${glabel(p.gender)}</span>
        ${p.startTime?`<span class="pg-tm">${esc(p.startTime)}</span>`:""}
      </div>
      <div class="pg-mt">${p.classGrade?`<b style="color:var(--fg)">${esc(p.classGrade)}</b>　`:""}${esc(p.day||"")} ${esc(p.round||"")}${cnt(p.no)?`・${cnt(p.no)}件${esc(heatInfo(p))}`:(p.note?`・${esc(p.note)}`:"")}</div>
    </div>${p.breakAfter?`<div class="brk">${esc(p.breakAfter)}</div>`:""}`).join("");
}
function pgHead(p){
  if(!p) return "";
  return `<div class="gsec ${gcls(p.gender)}">No.${p.no} ${gmark(p.gender)} ${esc((p.distance||"")+" "+(p.stroke||""))}${p.classGrade?" "+esc(p.classGrade):""}
    <span class="n">${p.startTime?"予定 "+esc(p.startTime)+" ／ ":""}${esc(p.day||"")} ${esc(p.round||"")}</span></div>`;
}

/* ---------- タブ4：リレー ---------- */
function viewRl(){
  const m = new Map();
  for(const r of RELAYS){
    const rd0 = (PROG_BY_NO.get((r.programNos||[])[0]) || {}).round || "";
    const k = glabel(r.gender) + " " + (r.event || ((r.distance||"")+" "+(r.stroke||"")))
            + (rd0 && rd0 !== "予選" ? " " + rd0 : "");
    if(!m.has(k)) m.set(k, []);
    m.get(k).push(r);
  }
  let h = "";
  // 予選→B決勝→決勝の順に、種目ごとにまとまるようプログラム番号順で出す
  const order = [...m.entries()].sort((a,b)=>
    Math.min(...a[1].map(r => (r.programNos||[999])[0])) -
    Math.min(...b[1].map(r => (r.programNos||[999])[0])));
  for(const [k, list0] of order){
    const done = hasRes(list0);
    const list = done ? [...list0].sort((a,b)=> resKey(a)-resKey(b) || resSec(a)-resSec(b))
                      : [...list0].sort((a,b)=> ordKey(a)-ordKey(b));
    const g = k.startsWith("女子") ? "f" : k.startsWith("混合") ? "x" : "m";
    h += `<div class="gsec ${g}">${k}<span class="n">${done?"🏁 結果・":""}${list.length}チーム</span></div>`;
    h += list.map((r,i)=>`<div class="sw ${g}${isHL(r.team)?" hl":""}">
      <div class="sw-r1">
        ${done
          ? (r.result && r.result.rank
              ? `<span class="rkno${r.result.rank===1&&isFinalA(r)?" m1":""}">${medalOf(r)||r.result.rank}</span>`
              : `<span class="rkno" style="background:rgba(140,155,185,.14);color:var(--muted)">-</span>`)
          : `<span class="sw-bd" style="margin:0 6px 0 0;background:rgba(255,204,102,.13);color:var(--gold)">${i+1}</span>`}
        <span class="sw-nm">${esc(r.team)}</span>${hlPill(r.team)}
        ${r.grade?`<span class="pill">${esc(shortGrade(r.grade))}</span>`:""}
        ${hitStd(r)?`<span class="pill t">★突破</span>`:""}
        ${r.note?`<span class="pill">${esc(r.note)}</span>`:""}
        ${done
          ? (r.result && r.result.note ? `<span class="sw-bd">${esc(r.result.note)}</span>`
             : r.result && r.result.time ? `<span class="sw-bd" style="color:var(--gold)">${esc(r.result.time)}</span>${recMk(r)}` : "")
          : tmTag(r,"span","sw-bd")}
      </div>
      ${memLine(r)}
    </div>`).join("");
  }
  return h || `<div class="empty"><span class="e">🔄</span>リレーの申込データがありません</div>`;
}

/* ---------- タブ5：組・レーン ---------- */
function rcHead(r){
  if(!r) return "";
  const cls = r.mixGender ? "m" : gcls(r.gender);
  const t0 = (PG_BY_NO.get(r.nos[0])||{}).startTime;
  return `<div class="gsec ${cls}">No.${r.nos.join("・")} ${raceMark(r)} ${esc(raceEvent(r))}
    <span class="n">${t0?"予定 "+esc(t0)+" ／ ":""}${esc(r.day||"")} ${esc(r.round||"")}${r.label?" ／ "+esc(r.label):""}</span></div>`;
}
function viewLn(){
  // 出場者が決まっていないレース（予選の結果待ちの決勝など）は選択肢に出さない。
  // 確定値方式（meta.laneConfirmed）の大会では、スタートリストがまだ出ていないレースも出さない（NTからの予想を並べない）。
  const shown = RACES.filter(r => raceList(r).length && (!META.laneConfirmed || raceList(r).some(e => e.heat && e.lane != null)));
  const opts = shown.map(r=>`<option value="${esc(r.key)}" ${ST.raceKey===r.key?"selected":""}>No.${r.nos.join("・")} ${esc(r.day||"")} ${r.mixGender?"男女":glabel(r.gender)} ${esc(raceEvent(r))}${r.label?" "+esc(r.label):""}</option>`).join("");
  const head = `<select id="lnSel"><option value="">— レースを選んでください —</option>${opts}</select>`;

  const r = ST.raceKey == null ? null : RACES.find(x => x.key === ST.raceKey);
  if(!r)
    return head + `<div class="empty"><span class="e">🏁</span>レースを選ぶと<br>組とレーンを表示します</div>`;

  const list = raceList(r);
  const UNIT = list.length && list.every(e => e.isRelay) ? "チーム" : "名";
  if(!list.length) return head + rcHead(r) + `<div class="empty"><span class="e">🫧</span>このレースの申込がありません</div>`;

  // 確定値方式では、スタートリストに載った人だけで組を組む（申込一覧にいて当日のリストに無い人は並べない）
  const confirmed = META.laneConfirmed && list.some(e => e.heat && e.lane != null);
  let heats;
  if(confirmed){
    const m = new Map();
    for(const e of list){
      if(!(e.heat && e.lane != null)) continue;
      if(!m.has(e.heat)) m.set(e.heat, {no:e.heat, n:0, seat:new Map()});   // 確定値は本当の組番号で出す（一部の選手だけの版で番号がずれないように）
      m.get(e.heat).seat.set(e.lane, e); m.get(e.heat).n++;
    }
    heats = [...m.entries()].sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  } else {
    heats = buildHeats(list);
  }

  const together = (r.nos.length > 1 || r.classes.length > 1)
    ? `<div class="note"><b>${esc(r.classes.join("・"))}</b>が<b>同じ組で一緒に泳ぎます</b>${r.nos.length>1?`（No.${r.nos.join("・")}）`:""}。
        順位・賞状は<b>学年区分ごと</b>です。同じ組で先にゴールした人がいても、区分が違えば順位は別に付きます。</div>`
    : "";
  const note = confirmed
    ? `<div class="note">大会プログラム掲載の<b>確定した組・レーン</b>です。棄権等で当日変わる場合があります。${META.laneListedOnly?`<br>${esc(META.laneListedOnly===true?"このページに載っている選手":META.laneListedOnly)}のレーンだけを出しています。`:""}</div>`
    : `<div class="note">これは<b>予想</b>で、公式のスタートリストではありません。エントリータイム順・${LANES.length}レーン想定で計算しています。
        第1組＝最も遅い組、組内は速い順に ${laneOrder(LANES).join("→")} の順で並べ、NT（タイムなし）は最も遅い扱いです。</div>`;

  const body = heats.map((h,hi)=>`<div class="heat">
      <div class="heat-h"><b>第${h.no||hi+1}組</b><span class="n">${h.n}${UNIT}${hi===0&&!confirmed?" ／ 最も遅い組":""}${hi===heats.length-1&&heats.length>1&&!confirmed?" ／ 最も速い組":""}</span></div>
      ${LANES.map(l=>{
        const e = h.seat.get(l);
        if(!e && META.laneListedOnly) return "";   // 一部の選手だけ載せた版（地元だけ等）: 他の子のレーンを「空き」と見せない
        if(!e) return `<div class="ln empty-ln"><div class="ln-no">${l}</div><div class="ln-b"><div class="ln-nm">（空き）</div></div></div>`;
        const chb = chBtn(e, "ln", {evLabel:`No.${r.nos.join("・")} ${r.mixGender?"男女":glabel(r.gender)} ${raceEvent(r)}${r.label?" "+r.label:""}`, heat:h.no||hi+1, lane:l});
        return `<div class="ln ${gcls(e.gender)}${isMk(e)?" hl":""}"${chb?` data-chrow="${chLast()}"`:""}>
          <div class="ln-no">${l}</div>
          <div class="ln-b">
            <div class="ln-nm">${esc(e.name)}</div>
            <div class="sw-r2">${e.team?`<span class="sw-tm">${esc(e.team)}</span>`:""}${mkPill(e)}${e.grade?`<span class="pill">${esc(shortGrade(e.grade))}</span>`:""}${hitStd(e)?`<span class="pill t">★</span>`:""}</div>
            ${memLine(e)}
          </div>
          ${e.result ? `<div class="ln-tm" style="color:var(--gold)">${esc(e.result.time || e.result.note || "")}${
              e.result.rank?` <span class="pill rk${e.result.rank===1&&isFinalA(e)?" m1":""}">${medalOf(e)}${e.result.rank}位</span>${ovPill(e)}${advPill(e)}`:""}${recMk(e)}</div>`
            : tmTag(e,"div","ln-tm")}${chb}</div>`;
      }).join("")}
    </div>`).join("");

  const ri = RACES.findIndex(x => x.key === r.key);
  const rpv = RACES[ri-1], rnx = RACES[ri+1];
  const rlab = x => `No.${x.nos.join("・")} ${x.mixGender?"男女":(isF(x.gender)?"女":"男")} ${esc(raceEvent(x).replace("メドレーリレー","MR").replace("フリーリレー","FR").replace("個人メドレー","IM").replace("バタフライ","バタ").replace("平泳ぎ","平").replace("背泳ぎ","背").replace("自由形","自"))}${x.label?" "+esc(x.label.replace("年生","")):""}`;
  const rb = (x, d) => x ? `<button class="tab" data-lngo="${d}" style="min-height:52px;flex:1;min-width:0;background:var(--card2);border-radius:11px;border:1px solid var(--border);color:var(--accent);font-size:12px;white-space:normal;line-height:1.3">${d<0?"◀ ":""}${rlab(x)}${d>0?" ▶":""}</button>` : `<span style="flex:1"></span>`;
  const rnav = `<div style="display:flex;gap:8px;margin:0 0 10px">${rb(rpv,-1)}${rb(rnx,1)}</div>`;
  return head + rnav + rcHead(r) + together + note +
    `<div class="count"><b>${list.length}</b>${UNIT} ／ ${META.laneListedOnly ? `全${(PROG_BY_NO.get(r.nos[0])||{}).heats || heats.length}組のうち${heats.length}組に出場` : `${heats.length}組（${LANES.length}レーン）`}</div>` + body + rnav;
}

/* ---------- タブ6：大会情報（meta.info があるときだけ） ---------- */
/* 出身校ごとにまとめ、行の主役は進んだ先（チーム名）にする。
   「どこから、どこへ行けるか」を見せるための画面。 */
function viewOg(){
  const by = new Map();
  for(const s of OGLIST){ if(!by.has(s.origin)) by.set(s.origin, []); by.get(s.origin).push(s); }
  const groups = [...by.entries()].sort((a,b) => b[1].length - a[1].length || a[0].localeCompare(b[0],"ja"));
  const teams  = new Set(OGLIST.map(s => s.team));
  let h = `<div class="ostat">
      <div><b>${OGLIST.length}</b><span>${esc(OG.unitLabel||"人")}</span></div>
      <div><b>${teams.size}</b><span>${esc(OG.toLabel||"進んだ先")}</span></div>
      <div><b>${groups.length}</b><span>${esc(OG.fromLabel||"出身校")}</span></div>
    </div>`;
  if(OG.lead) h += `<div class="note">${md(OG.lead)}</div>`;
  for(const [name, list] of groups){
    const us = new Set(list.map(s => s.team));
    h += `<div class="og"><span class="nm">${esc(name)}</span>
      <span class="n">${list.length}${esc(OG.unitLabel||"人")} → ${us.size}${esc(OG.toShort||"大学")}</span></div>`;
    list.sort((a,b) => gradeNum(a.grade)-gradeNum(b.grade) || a.name.localeCompare(b.name,"ja"));
    for(const s of list){
      const evs = (s.evs||[]).map(e => {
        const no = (e.programNos||[])[0];
        const nm = `${esc(e.distance||"")}${esc(e.stroke||"")}`;
        return `<a class="ogev"${no!=null?` data-jev="${no}"`:""}>${nm}${e.result?` ${resPill(e)}`:""}</a>`;
      }).filter(Boolean);
      // 個人種目が無い選手＝リレーで出場する選手。空欄にすると「情報が抜けている」と読まれるので必ず書く。
      const rlR = evs.length ? [] : RELAYS
        .filter(r => r.team === s.team && (r.members?.length ? r.members.includes(s.name) : isF(r.gender) === isF(s.gender)))
        .sort((a,b) => (a.programNos?.[0]||999) - (b.programNos?.[0]||999));
      const rl = rlR.map(r => `${esc(r.distance||"")}${esc(r.stroke||"")}`);
      const rlKnown = rlR.some(r => r.members?.length);
      h += `<div class="orow ${gcls(s.gender)}">
        <div class="to">${esc(s.team)}</div>
        <div class="who"><span class="nm">${esc(s.name)}</span>
          ${s.grade?`<span class="pill">${esc(shortGrade(s.grade))}</span>`:""}
          <span class="pill ${gcls(s.gender)}">${isF(s.gender)?"女子":"男子"}</span></div>
        ${s.originDetail?`<div class="from">🏫 ${esc(s.originDetail)}</div>`:""}
        ${evs.length?`<div class="ev">${evs.join("")}</div>`:""}
        ${rl.length?`<div class="rlv"><b>🏊 リレーで出場</b>${rlKnown?"":` <span class="dim">（泳者は当日発表）</span>`}<br>${rl.join("／")}</div>`:""}
      </div>`;
    }
  }
  if(OG.note) h += `<div class="note" style="margin-top:16px">${md(OG.note)}</div>`;
  return h;
}

function viewInfo(){
  return (META.info||[]).map(b => `<div class="ib">
    <h3>${esc(b.title||"")}</h3>
    ${b.rows ? `<table>${b.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>`
             : `<ul>${(b.items||[]).map(x=>`<li>${md(x)}</li>`).join("")}</ul>`}
  </div>`).join("");
}
/* ---------- タブ：当日プラン ----------
   meta.dayPlan と program[].startTime があるときだけ出る。
   選手を選ぶと、その子のレース予定時刻から 補食→招集→レース→ダウン を逆算して1日ぶん並べる。 */
const hhmm = t => { const m = String(t||"").match(/^(\d{1,2}):(\d{2})$/); return m ? (+m[1])*60 + (+m[2]) : null; };
const fmtm = v => Math.floor(v/60) + ":" + String(v%60).padStart(2,"0");

/* その選手のそのエントリーが、予想で第何組の何レーンになるか */
function seatOf(e){
  const r = RACE_BY_NO.get((e.programNos||[])[0]); if(!r) return null;
  const heats = buildHeats(raceList(r));
  for(let i=0;i<heats.length;i++)
    for(const [lane, x] of heats[i].seat)
      if(x === e || (x.id && e.id && x.id === e.id && x.programNos?.[0] === e.programNos?.[0]))
        return {heat:i+1, lane:lane, of:heats.length};
  return null;
}

function planFor(sw){
  const DP = META.dayPlan || {};
  const races = (sw.evs||[]).map(e => {
      const p = PG_BY_NO.get((e.programNos||[])[0]);
      const t = p && hhmm(p.startTime);
      return t == null ? null : {e, p, t};
    }).filter(Boolean).sort((a,b)=> a.t - b.t);

  const items = [];
  for(const f of (DP.fixed||[])){
    const t = hhmm(f.time); if(t == null) continue;
    items.push({t, o:0, kind:"fix", label:f.label, note:f.note});
  }
  const call = DP.callMinutes || 10;
  const dn   = DP.downMinutes || 15;
  const day0 = hhmm(DP.dayStart);

  let prevEnd = null;                       // 前のレースのダウンが終わる時刻
  races.forEach((r, i) => {
    const next = races[i+1];
    const lower = prevEnd != null ? prevEnd : (day0 == null ? -1 : day0);  // ここより前には置かない
    const upper = r.t - call;                                      // 招集より後には置かない
    // 補食は「前のレースのあと」かつ「招集より前」に入るぶんだけ出す
    const stages = (DP.fuel||[]).filter(s => (r.t - s[0]) > lower && (r.t - s[0]) < upper);
    if(stages.length){
      for(const s of stages) items.push({t:r.t - s[0], o:1, kind:"fuel",
        label:`補食（レース${s[0]}分前）`, note:s[1]});
    }else if(upper - 5 > lower){
      items.push({t:upper - 5, o:1, kind:"fuel", label:"水分補給",
        note:DP.shortGapNote || "前のレースからの間隔が短いので、軽いものにとどめる。"});
    }
    items.push({t:upper, o:2, kind:"call",
      label:`招集（No.${r.p.no}）`, note:`${fmtm(upper)} までに招集所へ。遅れると泳げない。`});
    items.push({t:r.t, o:3, kind:"race", race:r});
    // ダウンは次の招集に食い込ませない。入る余地が無いときは「すぐ招集へ」に置き換える。
    const nextCall = next ? next.t - call : null;
    const limit = nextCall == null ? Infinity : nextCall - 3;
    let dnT, tight = false;
    if(r.t + 3 <= limit){
      dnT = Math.max(r.t + 3, Math.min(r.t + dn, limit));
      tight = dnT < r.t + dn;
      items.push({t:dnT, o:4, kind:"down", label:"ダウン・水分",
        note: tight ? (DP.tightNote || "次の招集まで時間がありません。軽く流して、すぐ招集へ。")
                    : (DP.downNote || "ゆっくり泳いで整える。体を冷やさないように。")});
    }else{
      dnT = r.t + 1;
      items.push({t:dnT, o:4, kind:"down", label:"すぐ次の招集へ",
        note: DP.noRoomNote || "ダウンの時間がありません。水分だけとって招集所へ。ダウンは次のレースのあとで。"});
    }
    prevEnd = dnT;
  });
  items.sort((a,b)=> a.t - b.t || (a.o||0) - (b.o||0));
  return {races, items};
}

function viewDp(){
  const DP = META.dayPlan || {};
  const back = `<button class="tab" id="dpBack" style="min-height:48px;width:100%;background:var(--card2);border-radius:11px;border:1px solid var(--border);color:var(--accent);margin-bottom:10px">← ほかの選手を選ぶ</button>`;
  const sw = ST.dpKey ? SWL.find(s => KEY(s) === ST.dpKey) : null;

  if(!sw){
    const q = nx(ST.q), qk = nk(ST.q);
    let list = SWL;
    if(q) list = list.filter(s => s._n.includes(q) || s._t.includes(q) || (qk && s._k.includes(qk)));
    const body = !ST.q
      ? `<div class="empty"><span class="e">🕐</span>選手を選ぶと、その子の<br>1日の動き方が出ます</div>`
      : list.length
        ? `<div class="count"><b>${list.length}</b>名が該当</div>` +
          genderBlocks(list.slice(0,60), (a,b)=> gradeNum(a.grade)-gradeNum(b.grade) || a.name.localeCompare(b.name,"ja"))
        : `<div class="empty"><span class="e">🫧</span>該当する選手が見つかりません</div>`;
    return `<div class="note">${md(DP.intro || "選手を選ぶと、レースの予定時刻から**補食・招集・ダウン**を逆算して並べます。")}</div>
      <div class="field">
        <input id="q" type="text" value="${esc(ST.q)}" placeholder="${Q_PH}" autocomplete="off">
        <button id="qc">クリア</button>
      </div>
      <div class="chips">${TEAMS.map(t=>`<button data-tm="${esc(t[0])}">${esc(t[0])} ${t[1]}</button>`).join("")}</div>
      ${body}`;
  }

  const {races, items} = planFor(sw);
  const g = gcls(sw.gender);
  const head = `<div class="sw ${g}" style="cursor:default">
    <div class="sw-r1"><span class="sw-nm">${esc(sw.name)}</span>
      ${(META.showKana && sw.kana)?`<span class="sw-kn">${esc(sw.kana)}</span>`:""}
      <span class="sw-bd">${races.length}種目</span></div>
    <div class="sw-r2"><span class="sw-tm">${esc(sw.team)}</span>
      ${sw.grade?`<span class="pill">${esc(shortGrade(sw.grade))}</span>`:""}
      <span class="pill ${g}">${glabel(sw.gender)}</span></div></div>`;

  if(!races.length)
    return back + head + `<div class="empty"><span class="e">🫧</span>この選手の個人種目に<br>予定時刻が入っていません</div>`;

  const rows = items.map(x => {
    if(x.kind === "race"){
      const {e, p} = x.race;
      const st = seatOf(e);
      const cls = p.classGrade ? `<span class="pill">${esc(p.classGrade)}</span>` : "";
      return `<div class="tlr race ${gcls(e.gender)}"><span class="ti">${fmtm(x.t)}</span>
        <div class="tt">No.${p.no} ${esc((p.distance||"")+" "+(p.stroke||""))}</div>
        <div class="sw-r2">${cls}<span class="pill">申込 ${esc(showTime(e))}</span>
          ${st?`<span class="pill">予想 第${st.heat}組 ${st.lane}レーン</span>`:""}</div></div>`;
    }
    return `<div class="tlr ${x.kind}"><span class="ti">${fmtm(x.t)}</span>
      <div class="tt">${esc(x.label||"")}</div>
      ${x.note?`<div class="tn">${md(x.note)}</div>`:""}</div>`;
  }).join("");

  return back + head +
    `<div class="note">${md(DP.caution || "時刻は予定です。進行がずれることがあります。")}</div>
     <div class="tl">${rows}</div>
     ${DP.fuelNote?`<div class="note">${md(DP.fuelNote)}</div>`:""}`;
}

// **強調** だけ通す最小マークダウン（それ以外はエスケープ）
/* 注意書き用のごく小さな記法。**太字** と改行だけ。HTMLタグは書けない（そのまま文字として出る）。 */
function md(t){ return esc(t).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\r?\n/g, "<br>"); }

/* ---------- イベント配線 ---------- */
function bind(){
  const q = M.querySelector("#q");
  if(q){
    // 変換中(isComposing)に再描画すると入力欄のDOMごと作り直されてIMEの変換セッションが壊れ、
    // ローマ字入力が変になる（例: 「みや」と打っている途中で確定されたり文字が抜けたりする）。
    // 変換中は ST.q だけ更新して再描画を待ち、確定時(compositionend)にまとめて反映する。
    q.oninput = (e) => { ST.q = q.value; if(e.isComposing){ redrawSwRes(); return; } const p = q.selectionStart; redrawKeepFocus(p); };
    q.oncompositionend = () => { ST.q = q.value; const p = q.selectionStart; redrawKeepFocus(p); };
    M.querySelector("#qc").onclick = () => { ST.q = ""; render(); };
  }
  M.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { ST.gender = b.dataset.g; renderKeep(); });
  M.querySelectorAll("[data-tm]").forEach(b => b.onclick = () => { ST.q = b.dataset.tm; ST.hl = false; renderKeep(); });
  M.querySelectorAll("[data-hl]").forEach(b => b.onclick = () => { ST.hl = !ST.hl; ST.q = ""; if(!ST.hl) ST.hlDay = "all"; renderKeep(); });
  M.querySelectorAll("[data-hd]").forEach(b => b.onclick = () => { ST.hlDay = b.dataset.hd; render(); });
  M.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { ST.day = b.dataset.d; render(); });
  M.querySelectorAll("[data-no]").forEach(b => b.onclick = () => { ST.pgNo = +b.dataset.no; render(); });
  M.querySelectorAll(".sw[data-k]").forEach(c => c.onclick = () => {
    const k = c.dataset.k;
    if(ST.tab === "dp"){ ST.dpKey = k; render(); return; }   // 当日プランは選手を選ぶ操作
    if(ST.open.has(k)) ST.open.delete(k); else ST.open.add(k);
    c.classList.toggle("open");
  });
  // 出身タブなどから「その種目」へ飛ぶ
  M.querySelectorAll("[data-ptg]").forEach(b => b.onclick = () => { ST.ptG = +b.dataset.ptg; render(); });
  M.querySelectorAll("[data-jev]").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const i = EV_BY_NO.get(+b.dataset.jev);
    if(i != null){ ST.ev = i; ST.tab = "ev"; render(); }
  });
  M.querySelectorAll("[data-jn]").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const r = RACE_BY_NO.get(+b.dataset.jn);
    if(r){ ST.raceKey = r.key; ST.tab = "ln"; render(); }
  });
  const back = M.querySelector("#back"); if(back) back.onclick = () => { ST.pgNo = null; render(); };
  M.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    const i = PROGRAM.findIndex(x => x.no === ST.pgNo) + (+b.dataset.go);
    if(PROGRAM[i]){ ST.pgNo = PROGRAM[i].no; render(); }
  });
  M.querySelectorAll("[data-lngo]").forEach(b => b.onclick = () => {
    const i = RACES.findIndex(r => r.key === ST.raceKey) + (+b.dataset.lngo);
    if(RACES[i]){ ST.raceKey = RACES[i].key; render(); }
  });
  M.querySelectorAll(".pgnav").forEach(b => b.onclick = () => {
    const i = PROGRAM.findIndex(x => x.no === ST.pgNo); const p = PROGRAM[i + (+b.dataset.go)];
    if(p){ ST.pgNo = p.no; ST.day = "all"; render(); window.scrollTo(0, 0); }
  });
  const toLn = M.querySelector("#toLn"); if(toLn) toLn.onclick = () => {
    const r = RACE_BY_NO.get(ST.pgNo); ST.raceKey = r ? r.key : null; ST.tab = "ln"; render(); };
  const es = M.querySelector("#evSel"); if(es) es.onchange = () => { ST.ev = +es.value; render(); };
  M.querySelectorAll("[data-evgo]").forEach(b => b.onclick = () => { ST.ev += +b.dataset.evgo; render(); window.scrollTo(0, 0); });
  const ls = M.querySelector("#lnSel"); if(ls) ls.onchange = () => { ST.raceKey = ls.value || null; render(); };
  const dpb = M.querySelector("#dpBack"); if(dpb) dpb.onclick = () => { ST.dpKey = null; render(); };
  // 応援モード：📣ボタン、または（他に押す用の無い）種目・組レーンの行全体
  M.querySelectorAll("[data-ch]").forEach(b => b.onclick = ev => { ev.stopPropagation(); chOpen(+b.dataset.ch); });
  if(META.cheer !== false) M.querySelectorAll("[data-chrow]").forEach(el => { el.onclick = () => chOpen(+el.dataset.chrow); el.style.cursor = "pointer"; tappable(el, "名前をひらがなで大きく表示"); });
  M.querySelectorAll(".pg[data-no]").forEach(el => tappable(el, "この種目の詳細を見る"));
  M.querySelectorAll(".sw[data-k]").forEach(el => tappable(el, ST.tab === "dp" ? "この選手の当日プランを見る" : "この選手の種目を開く"));
  M.querySelectorAll("[data-jn]").forEach(el => tappable(el, "この種目の組・レーンを見る"));
  M.querySelectorAll("[data-jev]").forEach(el => tappable(el, "この種目を見る"));
}
function redrawKeepFocus(pos){
  CH_ROWS.length = 0;
  M.innerHTML = viewSw(); bind();
  const q = M.querySelector("#q");
  if(q){ q.focus(); try{ q.setSelectionRange(pos,pos); }catch(_){} }
}

/* ---------- フッター ---------- */
function footer(){
  const f = document.createElement("div");
  f.className = "ft";
  f.innerHTML = esc(META.disclaimer || "非公式のページです。正式な内容は大会の公式発表をご確認ください。")
                + "<br>転載はご遠慮ください。<br>" +
                (META.resultsUrl ? `結果: <a href="${esc(META.resultsUrl)}" style="color:var(--accent)">こちら</a><br>` : "") +
                (META.source ? esc(META.source) + "<br>" : "") +
                "© " + new Date().getFullYear() + " gyojin600m1" +
                '<div class="ct" id="ct"></div>';
  M.appendChild(f);
}
const _render = render;
render = function(){ _render(); footer(); count(); };

/* ---------- 閲覧カウンター（meta.counter.ns があるときだけ） ---------- */
let counted = false;
function count(){
  const el = document.getElementById("ct");
  if(!el || !META.counter?.ns) return;
  const NS = META.counter.ns, K = "cnt:" + NS, today = new Date().toISOString().slice(0,10);
  // localStorage が使えない環境（プライベートモード等）でも落とさない
  let hit = true;
  try { hit = localStorage.getItem(K) !== today; } catch(_){ hit = !counted; }
  const url = "https://abacus.jasoncameron.dev/" + (hit && !counted ? "hit" : "get") + "/" + NS + "/views";
  if(hit) { try { localStorage.setItem(K, today); } catch(_){} counted = true; }
  // キーがまだ無いと {"error":...} が返る。数が来たときだけ出す（「undefined 回閲覧」を出さない）。
  fetch(url).then(r=>r.json())
    .then(d=>{ if(typeof d?.value === "number") el.textContent = "👀 " + d.value + " 回閲覧";
               else if(url.indexOf("/get/") > 0) return fetch(url.replace("/get/","/hit/")).then(r=>r.json())
                        .then(d2=>{ if(typeof d2?.value === "number") el.textContent = "👀 " + d2.value + " 回閲覧"; }); })
    .catch(()=>{});
}

render();

/* ---------- 速報中だけ、新しい結果が出たら知らせる ----------
   GitHub Pages が HTML を10分キャッシュするよう指示するため、こちらが更新しても
   見ている人の画面は最大10分古いままになる。同じ場所に置いた live.json（数百バイト）
   だけを見に行き、件数が変わっていたら「新しい結果があります」を出す。
   勝手に読み直すと見ている途中の画面が飛ぶので、タップで更新してもらう。   */
/* ===== 速報タイム自動反映（起動後） ===== */
(()=>{
  const SK = "lvst:" + location.pathname;
  // 決勝の組が出て読み直したときに、見ていた画面へ戻す
  try{
    const s = JSON.parse(sessionStorage.getItem(SK) || "null");
    if(s && Date.now() - s.t < 60000){
      sessionStorage.removeItem(SK);
      for(const k of ["tab","q","gender","hl","hlDay","ev","day","pgNo","raceKey","dpKey","pt"]) if(k in s.st) ST[k] = s.st[k];
      ST.open = new Set(s.open || []);
      render(); setTimeout(() => window.scrollTo(0, s.y || 0), 0);
    }
  }catch(_){}
  const hdT = document.getElementById("hdT");
  const st = document.createElement("div");
  st.id = "lvst";
  st.style.cssText = "font-size:11px;opacity:.75;margin-top:3px";
  document.getElementById("hdS").after(st);
  const hm = d => d.toLocaleTimeString("ja-JP", {hour:"2-digit", minute:"2-digit", second:"2-digit", timeZone:"Asia/Tokyo"});
  const badge = () => {
    if(!hdT.querySelector(".live") && (ENTRIES.some(e => e.result) || RELAYS.some(r => r.result)))
      hdT.insertAdjacentHTML("beforeend", `<span class="live"><i></i>速報中</span>`);
  };
  const busy = () => (typeof CH_I !== "undefined" && CH_I != null)
    || (document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
  let pendingDraw = false, pendingReload = false;
  const t0 = Date.now();
  function reloadNow(){
    try{ sessionStorage.setItem(SK, JSON.stringify({t:Date.now(), y:window.scrollY, open:[...ST.open],
      st:{tab:ST.tab,q:ST.q,gender:ST.gender,hl:ST.hl,hlDay:ST.hlDay,ev:ST.ev,day:ST.day,pgNo:ST.pgNo,raceKey:ST.raceKey,dpKey:ST.dpKey,pt:ST.pt}})); }catch(_){}
    location.reload();
  }
  function flush(){
    if(busy()) return;
    if(pendingReload){ pendingReload = false; reloadNow(); return; }
    if(pendingDraw){ pendingDraw = false; renderKeep(); badge(); }
  }
  let running = false;
  async function tick(){
    if(running || document.hidden) return;
    running = true;
    try{
      const dirty = await LV.fetchAll();
      if(dirty){
        const r = LV.apply(DATA);
        if(r.added) pendingReload = true;       // 決勝のスタートリストが出た → 一覧に入れるため読み直す
        else if(r.changed) pendingDraw = true;
      }
      st.textContent = "⏱ 公式速報のタイムを自動で反映中（" + hm(new Date()) + " 確認）";
    }catch(_){
      st.textContent = "⏱ 速報の取得に失敗しました。電波の良い所で自動でやり直します";
    }finally{ running = false; }
    flush();
  }
  tick();
  setInterval(tick, 3000);
  setInterval(flush, 2000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) tick(); });
})();
